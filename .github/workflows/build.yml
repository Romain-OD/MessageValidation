name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore MessageValidation.slnx

      - name: Build
        run: dotnet build MessageValidation.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test MessageValidation.slnx --configuration Release --no-build --filter "Category!=Integration" --verbosity normal

      - name: Integration tests
        run: dotnet test MessageValidation.IntegrationTests/MessageValidation.IntegrationTests.csproj --configuration Release --no-build --filter "Category=Integration" --verbosity normal

      - name: Pack (validate packages)
        run: dotnet pack MessageValidation.slnx --configuration Release --no-build --output ./nupkgs
